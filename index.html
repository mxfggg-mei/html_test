<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCT-100 过程控制终端</title>
    <script src="paho-mqtt.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1d24;
            min-height: 100vh;
            color: #fff;
            overflow: hidden;
            zoom: 50%;
        }

        .header {
            background: #252a33;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 700;
            color: #5b9bd5;
        }

        .device-name {
            font-size: 0.95rem;
            color: #888;
        }

        .status-dots {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .status-dot {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .dot.green {
            background: #00ff88;
            box-shadow: 0 0 10px #00ff88;
        }

        .dot.red {
            background: #ff4757;
            box-shadow: 0 0 10px #ff4757;
        }

        .dot.gray {
            background: #555;
            box-shadow: none;
            animation: none;
        }

        .status-text {
            font-size: 0.85rem;
            color: #888;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .device-label {
            background: #333;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.85rem;
            color: #aaa;
        }

        .connection-status {
            font-size: 0.85rem;
            color: #888;
            padding: 4px 10px;
            background: #333;
            border-radius: 4px;
        }

        .connection-status.connected {
            color: #00ff88;
            background: rgba(0, 255, 136, 0.1);
        }

        .connection-status.disconnected {
            color: #ff4757;
            background: rgba(255, 71, 87, 0.1);
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 15px;
            height: calc(100vh - 56px);
        }

        .panel {
            background: #252a33;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
        }

        .panel-header {
            padding: 12px 15px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: #5b9bd5;
        }

        .panel-actions {
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 5px 12px;
            border: none;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #5b9bd5;
            color: #fff;
        }

        .btn-primary:hover {
            background: #4a8bc5;
        }

        .btn-secondary {
            background: #3a4149;
            color: #aaa;
        }

        .btn-secondary:hover {
            background: #4a5159;
        }

        .btn.active {
            background: #5b9bd5;
            color: #fff;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .panel-body {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
        }

        .sensor-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .sensor-card {
            background: #1a1d24;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }

        .sensor-label {
            font-size: 2rem;
            font-weight: 700;
            color: #5b9bd5;
            margin-bottom: 5px;
        }

        .sensor-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: #fff;
        }

        .sensor-unit {
            font-size: 1rem;
            color: #888;
            margin-left: 4px;
        }

        .sensor-name {
            font-size: 0.75rem;
            color: #666;
            margin-top: 8px;
        }

        .threshold-section {
            margin-top: 20px;
        }

        .threshold-row {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px 0;
            border-bottom: 1px solid #333;
        }

        .threshold-row:last-child {
            border-bottom: none;
        }

        .threshold-label {
            font-size: 0.85rem;
            color: #888;
            width: 70px;
        }

        .current-value {
            font-size: 1rem;
            font-weight: 600;
            color: #00ff88;
            min-width: 80px;
        }

        .threshold-input-group {
            display: flex;
            align-items: center;
            gap: 5px;
            flex: 1;
        }

        .threshold-input {
            background: #1a1d24;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 6px 10px;
            color: #fff;
            font-size: 0.9rem;
            width: 70px;
            text-align: center;
        }

        .threshold-input:focus {
            outline: none;
            border-color: #5b9bd5;
        }

        .arrow-btn {
            background: #333;
            border: none;
            border-radius: 4px;
            color: #888;
            width: 24px;
            height: 24px;
            cursor: pointer;
            font-size: 0.7rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 1px;
        }

        .arrow-btn:hover {
            background: #444;
        }

        .arrow-btn span {
            font-size: 0.6rem;
        }

        .actuator-section {
            margin-bottom: 20px;
        }

        .valve-status {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: #1a1d24;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .valve-label {
            font-size: 0.9rem;
            color: #888;
        }

        .valve-state {
            background: #00ff88;
            color: #1a1d24;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .valve-state.open {
            background: #ffc107;
        }

        .actuator-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .actuator-card {
            background: #1a1d24;
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .actuator-icon {
            font-size: 4rem;
            opacity: 0.7;
        }

        .actuator-name {
            font-size: 0.95rem;
            font-weight: 600;
            color: #fff;
        }

        .actuator-relay {
            font-size: 0.75rem;
            color: #666;
        }

        .actuator-switch {
            position: relative;
            width: 50px;
            height: 28px;
            cursor: pointer;
        }

        .actuator-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .actuator-slider {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #3a4149;
            border-radius: 14px;
            transition: 0.3s;
        }

        .actuator-slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 4px;
            bottom: 4px;
            background: #666;
            border-radius: 50%;
            transition: 0.3s;
        }

        input:checked + .actuator-slider {
            background: #5b9bd5;
        }

        input:checked + .actuator-slider:before {
            transform: translateX(22px);
            background: #fff;
        }

        .auto-hint {
            background: #333;
            padding: 10px 15px;
            border-radius: 6px;
            margin-top: 20px;
            text-align: center;
        }

        .auto-hint-text {
            font-size: 0.8rem;
            color: #ffc107;
        }

        .device-id-input {
            background: transparent;
            border: none;
            color: #5b9bd5;
            font-size: 0.85rem;
            font-weight: 600;
            width: 40px;
            text-align: center;
            outline: none;
        }

        .device-id-input:focus {
            border-bottom: 1px solid #5b9bd5;
        }

        .footer {
            background: #252a33;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #333;
        }

        .log-section {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .log-label {
            font-size: 0.85rem;
            color: #888;
        }

        .log-count {
            background: #5b9bd5;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.75rem;
            color: #fff;
        }

        .footer-switch {
            position: relative;
            width: 45px;
            height: 24px;
            cursor: pointer;
        }

        .footer-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .footer-slider {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #3a4149;
            border-radius: 12px;
            transition: 0.3s;
        }

        .footer-slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background: #666;
            border-radius: 50%;
            transition: 0.3s;
        }

        input:checked + .footer-slider {
            background: #00ff88;
            box-shadow: 0 0 8px rgba(0, 255, 136, 0.5);
        }

        input:checked + .footer-slider:before {
            transform: translateX(21px);
            background: #fff;
        }

        .debug-panel {
            position: fixed;
            bottom: 50px;
            left: 0;
            right: 0;
            height: 300px;
            background: #1a1d24;
            border-top: 1px solid #333;
            display: none;
            flex-direction: column;
            z-index: 1000;
        }

        .debug-panel.show {
            display: flex;
        }

        .debug-header {
            background: #252a33;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }

        .debug-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: #5b9bd5;
        }

        .debug-clear {
            background: #3a4149;
            border: none;
            color: #fff;
            padding: 4px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .debug-clear:hover {
            background: #4a5159;
        }

        .debug-content {
            flex: 1;
            overflow-y: auto;
            padding: 10px 20px;
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            line-height: 1.6;
        }

        .debug-line {
            margin-bottom: 4px;
            padding: 4px 8px;
            border-radius: 4px;
            word-wrap: break-word;
        }

        .debug-line.info {
            color: #5b9bd5;
            background: rgba(91, 155, 213, 0.1);
        }

        .debug-line.success {
            color: #00ff88;
            background: rgba(0, 255, 136, 0.1);
        }

        .debug-line.error {
            color: #ff4444;
            background: rgba(255, 68, 68, 0.1);
        }

        .debug-line.warning {
            color: #ffaa00;
            background: rgba(255, 170, 0, 0.1);
        }

        .debug-line.sent {
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
        }

        .debug-line.received {
            color: #4ecdc4;
            background: rgba(78, 205, 196, 0.1);
        }

        .debug-time {
            color: #666;
            margin-right: 8px;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .sensor-grid {
                grid-template-columns: 1fr;
            }

            .actuator-grid {
                grid-template-columns: 1fr;
            }

            .threshold-row {
                flex-wrap: wrap;
            }

            .mqtt-info {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <div class="logo">PCT-100</div>
            <div class="device-name">化工过程控制实训装置</div>
            <div class="status-dots">
                <div class="status-dot">
                    <div class="dot gray" id="mqtt-dot"></div>
                    <span class="status-text">MQTT</span>
                </div>
                <div class="status-dot">
                    <div class="dot gray" id="device-dot"></div>
                    <span class="status-text">设备</span>
                </div>
            </div>
        </div>
        <div class="header-right">
            <span class="device-label">设备 PCT_100_<input type="text" class="device-id-input" id="device-id-input" value="888" maxlength="3"></span>
            <span class="device-label">连接MQTT平台</span>
            <label class="footer-switch">
                <input type="checkbox" id="mqtt-switch">
                <span class="footer-slider"></span>
            </label>
        </div>
    </div>

    <div class="main-content">
        <div class="panel">
            <div class="panel-header">
                <span class="panel-title">传感器数据</span>
                <div class="panel-actions">
                    <button class="btn btn-primary active" id="server-outside">外网</button>
                    <button class="btn btn-secondary" id="server-inside">内网</button>
                </div>
            </div>
            <div class="panel-body">
                <div class="sensor-grid">
                    <div class="sensor-card">
                        <div class="sensor-label">T</div>
                        <div>
                            <span class="sensor-value" id="temp-value">--.-</span>
                            <span class="sensor-unit">°C</span>
                        </div>
                        <div class="sensor-name">温度 DS18B20</div>
                    </div>
                    <div class="sensor-card">
                        <div class="sensor-label">L</div>
                        <div>
                            <span class="sensor-value" id="light-value">----</span>
                            <span class="sensor-unit">Lux</span>
                        </div>
                        <div class="sensor-name">光照 GL5516</div>
                    </div>
                </div>

                <div class="threshold-section">
                    <div class="panel-title" style="margin-bottom: 15px; font-size: 0.85rem;">阈值设置</div>
                    <div class="threshold-row">
                        <span class="threshold-label">当前</span>
                        <span class="current-value" id="temp-current">28 °C</span>
                        <span class="threshold-label">温度阈值</span>
                        <div class="threshold-input-group">
                            <input type="number" class="threshold-input" id="temp-threshold" value="30" min="0" max="100">
                            <label class="arrow-btn" onclick="adjustThreshold('temp-threshold', 1)">
                                <span>▲</span>
                                <span>▼</span>
                            </label>
                        </div>
                        <button class="btn btn-primary" id="temp-submit">下发</button>
                    </div>
                    <div class="threshold-row">
                        <span class="threshold-label">当前</span>
                        <span class="current-value" id="light-current">300 Lux</span>
                        <span class="threshold-label">光照阈值</span>
                        <div class="threshold-input-group">
                            <input type="number" class="threshold-input" id="light-threshold" value="302" min="0" max="1000">
                            <label class="arrow-btn" onclick="adjustThreshold('light-threshold', 1)">
                                <span>▲</span>
                                <span>▼</span>
                            </label>
                        </div>
                        <button class="btn btn-primary" id="light-submit">下发</button>
                    </div>
                </div>

                
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">
                <span class="panel-title">执行器控制</span>
                <div class="panel-actions">
                    <button class="btn btn-primary active" id="mode-auto">自动</button>
                    <button class="btn btn-secondary" id="mode-manual">手动</button>
                </div>
            </div>
            <div class="panel-body">
                <div class="valve-status">
                    <span class="valve-label">总阀</span>
                    <span class="valve-state" id="valve-state">闭合</span>
                </div>

                <div class="actuator-grid">
                    <div class="actuator-card">
                        <div class="actuator-icon">💡</div>
                        <div class="actuator-name">灯光</div>
                        <div class="actuator-relay">继电器3</div>
                        <label class="actuator-switch">
                            <input type="checkbox" id="light-switch">
                            <span class="actuator-slider"></span>
                        </label>
                    </div>
                    <div class="actuator-card">
                        <div class="actuator-icon">🌀</div>
                        <div class="actuator-name">风扇</div>
                        <div class="actuator-relay">继电器4</div>
                        <label class="actuator-switch">
                            <input type="checkbox" id="fan-switch">
                            <span class="actuator-slider"></span>
                        </label>
                    </div>
                </div>

                <div class="auto-hint">
                    <span class="auto-hint-text">自动模式下执行器由设备自动控制</span>
                </div>
            </div>
        </div>
    </div>

    <div class="footer">
        <div class="log-section">
            <span class="log-label">调试日志</span>
            <span class="log-count" id="log-count">0</span>
        </div>
        <label class="footer-switch">
            <input type="checkbox" id="log-switch">
            <span class="footer-slider"></span>
        </label>
    </div>

    <div class="debug-panel" id="debug-panel">
        <div class="debug-header">
            <span class="debug-title">MQTT 调试信息</span>
            <button class="debug-clear" id="debug-clear">清空</button>
        </div>
        <div class="debug-content" id="debug-content"></div>
    </div>

    <script>
        var client;
        var statusTimer = null;
        var logCount = 0;
        var mqttHost = "47.98.170.180";
        var mqttPort = 8081;
        var mqttUser = "dzdx_emqx";
        var mqttPassword = "Jp4!sQ7$";
        
        function addDebugLog(message, type = 'info') {
            const debugContent = document.getElementById('debug-content');
            const logCountEl = document.getElementById('log-count');
            
            const now = new Date();
            const timeStr = now.toLocaleTimeString('zh-CN', { hour12: false }) + '.' + 
                           String(now.getMilliseconds()).padStart(3, '0');
            
            const logLine = document.createElement('div');
            logLine.className = `debug-line ${type}`;
            logLine.innerHTML = `<span class="debug-time">[${timeStr}]</span>${message}`;
            
            debugContent.appendChild(logLine);
            debugContent.scrollTop = debugContent.scrollHeight;
            
            logCount++;
            logCountEl.textContent = logCount;
            
            // 限制日志数量，最多保留100条
            while (debugContent.children.length > 100) {
                debugContent.removeChild(debugContent.firstChild);
            }
        }
        
        function getDeviceId() {
            const suffix = document.getElementById('device-id-input').value || '888';
            return `PCT_100_${suffix.padStart(3, '0')}`;
        }
        
        function getStatusTopic() {
            return `chemctrl/${getDeviceId()}/status`;
        }
        
        function getCommandTopic() {
            return `chemctrl/${getDeviceId()}/command`;
        }

        var deviceState = {
            temperature: 26.9,
            light: 492,
            mode: "auto",
            key1_lock: true,
            relay3: false,
            relay4: false,
            temp_threshold: 30.0,
            light_threshold: 302
        };

        function updateValue(elementId, min, max, decimals = 1) {
            const element = document.getElementById(elementId);
            const newValue = parseFloat((Math.random() * (max - min) + min).toFixed(decimals));
            element.textContent = newValue.toFixed(decimals);
            return newValue;
        }

        function adjustThreshold(inputId, delta) {
            const input = document.getElementById(inputId);
            const current = parseFloat(input.value);
            const min = parseFloat(input.min);
            const max = parseFloat(input.max);
            let newValue = current + delta;
            newValue = Math.max(min, Math.min(max, newValue));
            input.value = newValue;
        }

        function updateConnectionStatus(connected) {
            const mqttDot = document.getElementById('mqtt-dot');
            
            if (connected) {
                mqttDot.className = 'dot green';
                addDebugLog('MQTT 连接成功', 'success');
            } else {
                mqttDot.className = 'dot gray';
                addDebugLog('MQTT 已断开连接', 'warning');
            }
        }

        function updateDeviceDot(online) {
            const deviceDot = document.getElementById('device-dot');
            deviceDot.className = online ? 'dot green' : 'dot red';
        }

        function connectMQTT() {
            if (client && client.isConnected()) {
                console.log('Already connected');
                return;
            }

            const deviceId = getDeviceId();
            addDebugLog(`正在连接 MQTT 服务器 ${mqttHost}:${mqttPort} ...`, 'info');
            addDebugLog(`设备ID: ${deviceId}`, 'info');
            
            client = new Paho.MQTT.Client(mqttHost, mqttPort, "/", getDeviceId());
            
            client.onConnectionLost = function(responseObject) {
                console.log("Connection lost:", responseObject.errorMessage);
                updateConnectionStatus(false);
                addDebugLog(`连接丢失: ${responseObject.errorMessage}`, 'error');
            };

            client.onMessageArrived = function(message) {
                console.log("Message arrived:", message.destinationName, message.payloadString);
                addDebugLog(`收到消息: ${message.destinationName}`, 'received');
                addDebugLog(`  内容: ${message.payloadString}`, 'received');
                handleMessage(message.destinationName, message.payloadString);
            };

            var options = {
                useSSL: false,
                userName: mqttUser,
                password: mqttPassword,
                onSuccess: function() {
                    console.log("Connected to MQTT broker");
                    updateConnectionStatus(true);
                    
                    const statusTopic = getStatusTopic();
                    addDebugLog(`订阅主题: ${statusTopic}`, 'info');
                    client.subscribe(statusTopic);
                    sendGetStatus();
                    
                    if (statusTimer) {
                        clearInterval(statusTimer);
                    }
                    statusTimer = setInterval(function() {
                        sendGetStatus();
                    }, 5000);
                    addDebugLog('启动定时状态查询 (5秒间隔)', 'info');
                },
                onFailure: function(message) {
                    console.log("Connection failed:", message.errorMessage);
                    updateConnectionStatus(false);
                    addDebugLog(`连接失败: ${message.errorMessage}`, 'error');
                },
                keepAliveInterval: 30
            };

            client.connect(options);
        }

        function disconnectMQTT() {
            if (client && client.isConnected()) {
                client.disconnect();
                updateConnectionStatus(false);
                console.log('Disconnected from MQTT broker');
                addDebugLog('主动断开 MQTT 连接', 'warning');
            }
            
            if (statusTimer) {
                clearInterval(statusTimer);
                statusTimer = null;
                addDebugLog('停止定时状态查询', 'info');
            }
        }

        function sendCommand(cmd) {
            if (!client || !client.isConnected()) {
                console.log('Not connected to MQTT');
                addDebugLog('未连接到 MQTT 服务器，无法发送命令', 'error');
                return;
            }
            
            var message = new Paho.MQTT.Message(JSON.stringify(cmd));
            message.destinationName = getCommandTopic();
            message.qos = 1;
            client.send(message);
            
            const commandTopic = getCommandTopic();
            addDebugLog(`发送命令到: ${commandTopic}`, 'sent');
            addDebugLog(`  内容: ${JSON.stringify(cmd)}`, 'sent');
        }

        function sendSetRelay(relay, value) {
            sendCommand({ cmd: "set_relay", relay: relay, value: value });
        }

        function sendGetStatus() {
            if (!client || !client.isConnected()) {
                console.log('Not connected to MQTT');
                return;
            }
            
            var message = new Paho.MQTT.Message(JSON.stringify({ cmd: "get_status" }));
            message.destinationName = getCommandTopic();
            message.qos = 0;
            client.send(message);
            console.log('Sent get_status command to:', getCommandTopic());
        }

        function sendSetMode(mode) {
            sendCommand({ cmd: "set_mode", mode: mode });
        }

        function sendSetThreshold(temp, light) {
            const cmd = { cmd: "set_threshold" };
            if (temp !== undefined) cmd.temp = temp;
            if (light !== undefined) cmd.light = light;
            sendCommand(cmd);
        }

        function handleMessage(topic, payload) {
            try {
                const data = JSON.parse(payload);
                
                if (topic === getStatusTopic()) {
                    updateDeviceState(data);
                    updateUI();
                }
            } catch (e) {
                console.error('Error parsing message:', e);
            }
        }

        function updateDeviceState(data) {
            if (data.temperature !== undefined) deviceState.temperature = data.temperature;
            if (data.light !== undefined) deviceState.light = data.light;
            if (data.mode !== undefined) deviceState.mode = data.mode;
            if (data.key1_lock !== undefined) deviceState.key1_lock = data.key1_lock;
            if (data.relay3 !== undefined) deviceState.relay3 = data.relay3;
            if (data.relay4 !== undefined) deviceState.relay4 = data.relay4;
            if (data.temp_threshold !== undefined) deviceState.temp_threshold = data.temp_threshold;
            if (data.light_threshold !== undefined) deviceState.light_threshold = data.light_threshold;
            
            updateDeviceDot(true);
        }

        function updateUI() {
            document.getElementById('temp-value').textContent = deviceState.temperature.toFixed(1);
            document.getElementById('light-value').textContent = deviceState.light;
            document.getElementById('temp-threshold').value = deviceState.temp_threshold;
            document.getElementById('light-threshold').value = deviceState.light_threshold;
            document.getElementById('light-switch').checked = deviceState.relay3;
            document.getElementById('fan-switch').checked = deviceState.relay4;
            
            if (deviceState.mode === 'auto') {
                document.getElementById('mode-auto').click();
            } else {
                document.getElementById('mode-manual').click();
            }
        }

        const serverBtns = document.querySelectorAll('#server-outside, #server-inside');
        serverBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                serverBtns.forEach(b => b.classList.remove('active', 'btn-primary'));
                serverBtns.forEach(b => b.classList.add('btn-secondary'));
                this.classList.add('active', 'btn-primary');
                this.classList.remove('btn-secondary');
            });
        });

        const modeBtns = document.querySelectorAll('#mode-auto, #mode-manual');
        const actuatorSwitches = document.querySelectorAll('.actuator-switch input');
        
        modeBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                modeBtns.forEach(b => b.classList.remove('active', 'btn-primary'));
                modeBtns.forEach(b => b.classList.add('btn-secondary'));
                this.classList.add('active', 'btn-primary');
                this.classList.remove('btn-secondary');
                
                const isAuto = this.id === 'mode-auto';
                actuatorSwitches.forEach(sw => {
                    sw.disabled = isAuto;
                    sw.parentElement.style.opacity = isAuto ? 0.5 : 1;
                });
                
                if (!isAuto && client && client.isConnected()) {
                    sendSetMode('manual');
                }
            });
        });

        document.getElementById('light-switch').addEventListener('change', function() {
            if (!this.disabled && client && client.isConnected()) {
                sendSetRelay(3, this.checked);
            }
        });

        document.getElementById('fan-switch').addEventListener('change', function() {
            if (!this.disabled && client && client.isConnected()) {
                sendSetRelay(4, this.checked);
            }
        });

        document.getElementById('temp-submit').addEventListener('click', function() {
            const value = parseFloat(document.getElementById('temp-threshold').value);
            if (client && client.isConnected()) {
                sendSetThreshold(value, undefined);
            }
        });

        document.getElementById('light-submit').addEventListener('click', function() {
            const value = parseFloat(document.getElementById('light-threshold').value);
            if (client && client.isConnected()) {
                sendSetThreshold(undefined, value);
            }
        });

        document.getElementById('mqtt-switch').addEventListener('change', function() {
            if (this.checked) {
                connectMQTT();
            } else {
                disconnectMQTT();
            }
        });

        document.getElementById('device-id-input').addEventListener('input', function() {
            this.value = this.value.replace(/\D/g, '').slice(0, 3);
        });
    </script>
</body>
</html>
